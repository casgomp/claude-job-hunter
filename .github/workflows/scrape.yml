name: Scrape and Score Jobs

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (days 1, 4, 7, 10... of each month)
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            backend/package-lock.json

      - name: Create .env file from secrets
        run: |
          echo "JSEARCH_API_KEY=${{ secrets.JSEARCH_API_KEY }}"   >> .env
          echo "ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}"       >> .env
          echo "ADZUNA_APP_KEY=${{ secrets.ADZUNA_APP_KEY }}"     >> .env
          echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}"     >> .env

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run scraper
        run: node scraper/src/index.js

      - name: Run scorer
        working-directory: backend
        run: node src/scorer.js

      - name: Commit updated job files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/scorer.js
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update jobs + improve scorer [$(date -u +'%Y-%m-%d')]"
          git push
